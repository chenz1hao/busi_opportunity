// 从错误响应中提取用户可读信息：优先解析 JSON 中的 message 字段，避免弹出原始 JSON 串
async function extractErrorMessage(res) {
  const text = await res.text().catch(() => '');
  if (!text) return `请求失败(${res.status}): ${res.statusText}`;
  try {
    const data = JSON.parse(text);
    if (data && typeof data.message === 'string' && data.message.trim()) {
      return data.message;
    }
  } catch (_) { /* 非 JSON，按原文处理 */ }
  return `请求失败(${res.status}): ${text}`;
}
const api = {
  async get(url, params) {
    const query = params ? '?' + new URLSearchParams(
      Object.entries(params).filter(([_,v]) => v != null && v !== '')
    ).toString() : '';
    const res = await fetch(url + query);
    if (!res.ok) {
      const text = await res.text().catch(() => '');
      throw new Error(`请求失败(${res.status}): ${text || res.statusText}`);
    }
    return res.json();
  },
  async post(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!res.ok) {
      throw new Error(await extractErrorMessage(res));
    }
    return res.json();
  },
  async put(url, body) {
    const res = await fetch(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    if (!res.ok) {
      throw new Error(await extractErrorMessage(res));
    }
    return res.json();
  },
  async del(url) {
    const res = await fetch(url, { method: 'DELETE' });
    if (!res.ok) {
      throw new Error(await extractErrorMessage(res));
    }
    return res.json();
  },

// 城市名到省份路径的映射，用于编辑时回填级联选择器
function findCityPath(cityName) {
  if (!cityName) return [];
  for (const item of PROVINCE_CITY_DATA) {
    if (item.value === cityName) return [item.value];
    if (item.children) {
      for (const child of item.children) {
        if (child.value === cityName) return [item.value, child.value];
      }
    }
  }
  return [cityName]; // 找不到则回退到自定义值
}

      <el-table-column prop="totalCount" label="处理总数" width="100" />
      <el-table-column prop="newCount" label="新增/分析数" width="110" />
      <el-table-column prop="errorMsg" label="错误信息" min-width="200" show-overflow-tooltip />
    </el-table>
  </el-card>
</div>`,
  setup() {
    const { ElMessage } = ElementPlus;
    const stats = ref({});
    const schedulerLogs = ref([]);
    const cityChartRef = ref(null);
    const typeChartRef = ref(null);
    const searchLoading = ref(false);
    const analysisLoading = ref(false);
    // 有任务执行中时启动轮询
    let pollTimer = null;

    const loadData = async () => {
      let statsData, logsData, cityData, typeData;
      try {
        [statsData, logsData, cityData, typeData] = await Promise.all([
          api.getStatistics(), api.getSchedulerLogs(), api.getCityStatistics(), api.getTypeStatistics()
        ]);
        stats.value = statsData;
        schedulerLogs.value = logsData;
      } catch (e) {
        console.error('仪表盘 API 加载失败:', e);
        ElMessage.error('加载数据失败: ' + (e && e.message ? e.message : e));
        return;
      }
      await nextTick();
      // 图表渲染独立 try-catch：API 数据已加载，图表失败不应影响其他面板
      try { renderCityChart(cityData); }
      catch (e1) { console.error('城市分布图渲染失败:', e1); ElMessage.warning('城市分布图渲染失败: ' + (e1 && e1.message ? e1.message : e1)); }
      try { renderTypeChart(typeData); }
      catch (e2) { console.error('类型分布图渲染失败:', e2); ElMessage.warning('类型分布图渲染失败: ' + (e2 && e2.message ? e2.message : e2)); }
      checkPolling();
    };

    // 若最新日志中存在 RUNNING 状态，则启动轮询；否则停止
    const checkPolling = () => {
      const hasRunning = schedulerLogs.value.some(l => l.status === 'RUNNING');
      if (hasRunning) startPolling();
      else stopPolling();
    };

    const startPolling = () => {
      if (pollTimer) return;
      pollTimer = setInterval(async () => {
        let cityData, typeData;
        try {
          const [statsData, logsData, cData, tData] = await Promise.all([
            api.getStatistics(), api.getSchedulerLogs(), api.getCityStatistics(), api.getTypeStatistics()
          ]);
          stats.value = statsData;
          schedulerLogs.value = logsData;
          cityData = cData; typeData = tData;
        } catch (e) { console.error('轮询 API 失败:', e); return; }
        await nextTick();
        try { renderCityChart(cityData); } catch (e1) { console.error('轮询城市图渲染失败:', e1); }
        try { renderTypeChart(typeData); } catch (e2) { console.error('轮询类型图渲染失败:', e2); }
        checkPolling();
      }, 3000);
    };

    const stopPolling = () => {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    };

    const renderCityChart = (data) => {
      if (!cityChartRef.value) return;
      const chart = echarts.init(cityChartRef.value);
      const cities = data.slice(0, 15).map(d => d.city);
      const counts = data.slice(0, 15).map(d => d.count);
      chart.setOption({
        tooltip: { trigger: 'axis' },
        xAxis: { type: 'category', data: cities, axisLabel: { rotate: 45 } },
        yAxis: { type: 'value' },
        series: [{ type: 'bar', data: counts, itemStyle: { color: '#409EFF' } }],
        grid: { bottom: 80 }
      });
    };

    const renderTypeChart = (data) => {
      if (!typeChartRef.value) return;
      const chart = echarts.init(typeChartRef.value);
      chart.setOption({
        tooltip: { trigger: 'item' },
        series: [{
          type: 'pie', radius: ['40%', '70%'],
          data: data.map(d => ({ name: d.type, value: d.count })),
          emphasis: { itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0,0,0,0.5)' } }
        }]
      });
    };

    const handleTriggerSearch = async () => {
      searchLoading.value = true;
      try {
        const res = await api.triggerSearch();
        if (res.status === 'error') {
          ElMessage.warning(res.message);
        } else {
          ElMessage.success(res.message || '搜索任务已下发，请稍后查看');
          // 立即刷新一次日志（看到 RUNNING 记录）并启动轮询
          schedulerLogs.value = await api.getSchedulerLogs();
          checkPolling();
        }
      } catch (e) { ElMessage.error('搜索触发失败: ' + e.message); }
      finally { searchLoading.value = false; }
    };

    const handleTriggerAnalysis = async () => {
      analysisLoading.value = true;
      try {
        const res = await api.triggerAnalysis();
        if (res.status === 'error') {
          ElMessage.warning(res.message);
        } else {
          ElMessage.success(res.message || '分析任务已下发，请稍后查看');
          schedulerLogs.value = await api.getSchedulerLogs();
          checkPolling();
        }
      } catch (e) { ElMessage.error('分析触发失败: ' + e.message); }
      finally { analysisLoading.value = false; }
    };

    onMounted(loadData);
    // 组件卸载时清理定时器
    onUnmounted(stopPolling);
    return { stats, schedulerLogs, cityChartRef, typeChartRef, searchLoading, analysisLoading, handleTriggerSearch, handleTriggerAnalysis };
  }
};

      return p[p.length - 1]; // 取最末级城市名作为存储值
    }
    async function submitCity() {
      const cityName = extractCityName().trim();
      if (!cityName) {
        ElMessage.warning('请选择城市'); return;
      }
      citySaving.value = true;
      try {
        if (cityForm.id) {
          await api.updateCity(cityForm.id, { cityName });
          ElMessage.success('修改成功');
        } else {
          await api.addCity(cityName);
          ElMessage.success('新增成功');
        }
        cityDialogVisible.value = false;
        await reloadAll();
      } catch (e) { ElMessage.error(e.message); }
      finally { citySaving.value = false; }
    }
    async function removeCity(row) {
      try {
        await ElMessageBox.confirm('确定删除城市「' + row.cityName + '」？', '提示', { type: 'warning' });
      } catch { return; }
      try {
        await api.deleteCity(row.id);
        ElMessage.success('删除成功');
        await reloadAll();
      } catch (e) { ElMessage.error(e.message); }
    }

    function openEditSystem(row) {
      editingKey.value = row.configKey;
      editingValue.value = row.configValue;
    }
    function cancelEditSystem() {
      editingKey.value = ''; editingValue.value = '';
    }
    async function saveSystemConfig(row) {
      if (!editingValue.value || !editingValue.value.trim()) {
        ElMessage.warning('配置值不能为空'); return;
      }
      try {
        await api.updateSystemConfig(row.configKey, editingValue.value.trim());
        ElMessage.success('保存成功');
        cancelEditSystem();
        await loadSystemConfigs();
      } catch (e) { ElMessage.error(e.message); }
    }

    // 格式化时间为 yyyy年MM月DD日 HH:mm:ss
    function formatTime(value) {
      if (!value) return '';
      const d = new Date(value);
      if (isNaN(d.getTime())) return String(value);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}年${pad(d.getMonth() + 1)}月${pad(d.getDate())}日 ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    onMounted(async () => {
      await reloadAll();
    });

    return {
      cityList, systemList, configInfo, scoringRules,
      provinceCityData: PROVINCE_CITY_DATA,
      findCityPath,
      formatTime,
      analysisModelOptions, analysisModelSelected,
      cityDialogVisible, cityDialogTitle, cityForm, citySaving,
      editingKey, editingValue,
      openAddCity, openEditCity, submitCity, removeCity,
      openEditSystem, cancelEditSystem, saveSystemConfig,
      reloadAll,
    };
  }
};

// ========== 路由配置 ==========
const routes = [
  { path: '/', component: Dashboard },
  { path: '/records', component: RecordList },
  { path: '/records/:id', component: RecordDetail, props: true },
  { path: '/config', component: Config },
];

const router = createRouter({
  history: createWebHashHistory(),
  routes,
});

// ========== 启动应用 ==========
const app = createApp({
  computed: {
    currentRoute() { return this.$route.path; }
  }
});
app.use(router);
app.use(ElementPlus);
// 注册图标
for (const [key, comp] of Object.entries(ElementPlusIconsVue)) {
  app.component(key, comp);
}
app.mount('#app');
</script>
