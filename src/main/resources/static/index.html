  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #3b82f6;
      --primary-dark: #1d4ed8;
      --success: #10b981;
      --success-light: #d1fae5;
      --warning: #f59e0b;
      --warning-light: #fef3c7;
      --danger: #ef4444;
      --danger-light: #fee2e2;
      --info: #6b7280;
      --sidebar-width: 240px;
      --header-height: 64px;
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-tertiary: #94a3b8;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.06);
      --shadow-lg: 0 8px 24px rgba(0,0,0,.08);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
      color: var(--text-primary);
      background: var(--bg-body);
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ========== 布局 ========== */
    .app-container { display: flex; height: 100vh; overflow: hidden; }

    .sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      display: flex; flex-direction: column;
      transition: width .3s ease;
      flex-shrink: 0; z-index: 100;
    }
    .sidebar-logo {
      height: var(--header-height);
      display: flex; align-items: center; gap: 12px;
      padding: 0 20px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      flex-shrink: 0;
    }
    .sidebar-logo .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; flex-shrink: 0;
    }
    .sidebar-logo .logo-text {
      color: #fff; font-size: 16px; font-weight: 600;
      white-space: nowrap; letter-spacing: .5px;
    }
    .sidebar-menu { flex: 1; padding: 12px 0; overflow-y: auto; }
    .sidebar-menu .el-menu { background: transparent !important; border: none !important; }
    .sidebar-menu .el-menu-item {
      height: 46px !important; line-height: 46px !important;
      margin: 4px 12px !important; border-radius: var(--radius-sm) !important;
      color: #94a3b8 !important; font-size: 14px;
      transition: all .2s !important;
    }
    .sidebar-menu .el-menu-item:hover {
      background: rgba(255,255,255,.06) !important; color: #e2e8f0 !important;
    }
    .sidebar-menu .el-menu-item.is-active {
      background: var(--primary) !important; color: #fff !important;
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(37,99,235,.35);
    }
    .sidebar-menu .el-menu-item .el-icon { font-size: 18px; }
    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255,255,255,.08);
      color: #64748b; font-size: 12px;

    .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .app-header {
      height: var(--header-height);
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);

      padding: 0 28px; flex-shrink: 0;

    .header-left { display: flex; align-items: center; gap: 16px; }
    .header-title { font-size: 18px; font-weight: 600; color: var(--text-primary); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-time { color: var(--text-tertiary); font-size: 13px; }

    .app-main { flex: 1; padding: 24px 28px; overflow-y: auto; }

    .page-title {
      font-size: 22px; font-weight: 700; color: var(--text-primary);
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .page-title::before {
      content: ''; display: block; width: 4px; height: 22px;
      background: var(--primary); border-radius: 2px;
    }

    .el-card {
      border-radius: var(--radius-md) !important;
      border: 1px solid var(--border-color) !important;
      box-shadow: var(--shadow-sm) !important;
      transition: box-shadow .3s, transform .3s !important;
    }
    .el-card:hover { box-shadow: var(--shadow-md) !important; }
    .el-card__header {

      border-bottom: 1px solid var(--border-color) !important;
      font-weight: 600; font-size: 15px;
    }
    .el-card__body { padding: 20px !important; }

    }
    .stat-card {
      background: var(--bg-card); border-radius: var(--radius-md);

      font-size: 24px; margin-bottom: 16px;

    .stat-card .stat-trend { font-size: 12px; margin-top: 4px; }
    .stat-card.card-total .stat-icon { background: #eff6ff; color: var(--primary); }
    .stat-card.card-total .stat-value { color: var(--primary); }
    .stat-card.card-scored .stat-icon { background: var(--success-light); color: var(--success); }
    .stat-card.card-scored .stat-value { color: var(--success); }

    .stat-card.card-pending .stat-value { color: var(--warning); }
    .stat-card.card-action { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .stat-card.card-action .action-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .stat-card.card-action .stat-label { margin-top: 12px; }

    .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    .chart-card .chart-wrapper { height: 350px; width: 100%; }
    .log-table-card .el-card__body { padding: 0 !important; }

    /* ========== 线索列表 ========== */

    .filter-card .el-card__body { padding: 18px 20px !important; }
    .filter-form .el-form-item { margin-bottom: 0 !important; }
    .filter-form .el-form-item__label { font-size: 13px; color: var(--text-secondary); }

    .table-card .el-card__body { padding: 0 !important; }
    .el-table th.el-table__cell { background: #f8fafc !important; color: var(--text-primary) !important; font-weight: 600; font-size: 13px; }
    .el-table--striped .el-table__body tr.el-table__row--striped td.el-table__cell { background: #f8fafc !important; }
    .el-table .el-table__body tr:hover > td.el-table__cell { background: #eff6ff !important; }
    .el-table td.el-table__cell { font-size: 13px; }
    .el-table .cell { padding: 0 16px !important; }
    .pagination-row { display: flex; justify-content: center; padding: 20px 0; }

    .el-descriptions__cell.el-descriptions__label { background: #f8fafc !important; font-weight: 500 !important; }
    .content-box {

    .el-message { border-radius: var(--radius-md) !important; box-shadow: var(--shadow-lg) !important; }

</head>

const { createApp, ref, reactive, computed, onMounted, onUnmounted, nextTick } = Vue;
const { createRouter, createWebHashHistory } = VueRouter;

async function extractErrorMessage(res) {
  const text = await res.text().catch(() => '');
  if (!text) return `请求失败(${res.status}): ${res.statusText}`;
  try { const data = JSON.parse(text); if (data && typeof data.message === 'string' && data.message.trim()) return data.message; } catch (_) {}
  return `请求失败(${res.status}): ${text}`;
}
const api = {
  async get(url, params) {
    const query = params ? '?' + new URLSearchParams(Object.entries(params).filter(([_,v]) => v != null && v !== '')).toString() : '';
    const res = await fetch(url + query);
    if (!res.ok) throw new Error(await extractErrorMessage(res));
    return res.json();
  },
  async post(url, body) {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    if (!res.ok) throw new Error(await extractErrorMessage(res));
    return res.json();
  },
  async put(url, body) {
    const res = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    if (!res.ok) throw new Error(await extractErrorMessage(res));
    return res.json();
  },
  async del(url) {
    const res = await fetch(url, { method: 'DELETE' });
    if (!res.ok) throw new Error(await extractErrorMessage(res));
    return res.json();
  },
  getStatistics: () => api.get('/api/statistics'),
  getRecords: (params) => api.get('/api/records', params),
  getRecord: (id) => api.get('/api/records/' + id),
  getRecordCities: () => api.get('/api/records/cities'),
  triggerSearch: (cities) => api.post('/api/trigger/search', cities ? { cities } : null),
  triggerAnalysis: () => api.post('/api/trigger/analysis'),
  getCities: () => api.get('/api/config/cities'),
  getAllCities: () => api.get('/api/config/cities/all'),
  addCity: (cityName) => api.post('/api/config/cities', { cityName }),
  updateCity: (id, body) => api.put('/api/config/cities/' + id, body),
  deleteCity: (id) => api.del('/api/config/cities/' + id),
  getConfigInfo: () => api.get('/api/config/info'),
  getAllSystemConfigs: () => api.get('/api/config/system'),
  updateSystemConfig: (configKey, configValue) => api.put('/api/config/system', { configKey, configValue }),
  getSchedulerLogs: () => api.get('/api/config/scheduler-logs'),
  getCityStatistics: () => api.get('/api/statistics/by-city'),
  getTypeStatistics: () => api.get('/api/statistics/by-type'),
};

function findCityPath(cityName) {
  if (!cityName) return [];
  for (const item of PROVINCE_CITY_DATA) {
    if (item.value === cityName) return [item.value];
    if (item.children) { for (const child of item.children) { if (child.value === cityName) return [item.value, child.value]; } }
  }
  return [cityName];
}

      <el-table-column prop="errorMsg" label="错误信息" min-width="200" show-overflow-tooltip />
    </el-table>
  </el-card>
</div>`,
  setup() {
    const { ElMessage } = ElementPlus;
    const stats = ref({});
    const schedulerLogs = ref([]);
    const cityChartRef = ref(null);
    const typeChartRef = ref(null);
    const searchLoading = ref(false);
    const analysisLoading = ref(false);
    let pollTimer = null;

    const loadData = async () => {
      let statsData, logsData, cityData, typeData;
      try {
        [statsData, logsData, cityData, typeData] = await Promise.all([
          api.getStatistics(), api.getSchedulerLogs(), api.getCityStatistics(), api.getTypeStatistics()
        ]);
        stats.value = statsData;
        schedulerLogs.value = logsData;
      } catch (e) {
        console.error('仪表盘 API 加载失败:', e);
        ElMessage.error('加载数据失败: ' + (e && e.message ? e.message : e));
        return;
      }
      await nextTick();
      try { renderCityChart(cityData); } catch (e1) { console.error('城市分布图渲染失败:', e1); }
      try { renderTypeChart(typeData); } catch (e2) { console.error('类型分布图渲染失败:', e2); }
      checkPolling();
    };
    const checkPolling = () => {
      const hasRunning = schedulerLogs.value.some(l => l.status === 'RUNNING');
      if (hasRunning) startPolling(); else stopPolling();
    };
    const startPolling = () => {
      if (pollTimer) return;
      pollTimer = setInterval(async () => {
        try {
          const [statsData, logsData, cData, tData] = await Promise.all([
            api.getStatistics(), api.getSchedulerLogs(), api.getCityStatistics(), api.getTypeStatistics()
          ]);
          stats.value = statsData; schedulerLogs.value = logsData;
          await nextTick();
          try { renderCityChart(cData); } catch (e) {}
          try { renderTypeChart(tData); } catch (e) {}
          checkPolling();
        } catch (e) { console.error('轮询失败:', e); }
      }, 3000);
    };
    const stopPolling = () => { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } };

    const renderCityChart = (data) => {
      if (!cityChartRef.value) return;
      const chart = echarts.init(cityChartRef.value);
      const cities = data.slice(0, 15).map(d => d.city);
      const counts = data.slice(0, 15).map(d => d.count);
      chart.setOption({
        tooltip: { trigger: 'axis', backgroundColor: '#fff', borderColor: '#e2e8f0', textStyle: { color: '#1e293b' } },
        grid: { left: 50, right: 20, bottom: 90, top: 20 },
        xAxis: { type: 'category', data: cities, axisLabel: { rotate: 45, color: '#64748b', fontSize: 12 }, axisLine: { lineStyle: { color: '#e2e8f0' } } },
        yAxis: { type: 'value', splitLine: { lineStyle: { color: '#f1f5f9' } }, axisLabel: { color: '#94a3b8' } },
        series: [{ type: 'bar', data: counts, barWidth: '55%', itemStyle: { borderRadius: [6,6,0,0], color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#3b82f6'},{offset:1,color:'#2563eb'}]) } }]
      });
    };
    const renderTypeChart = (data) => {
      if (!typeChartRef.value) return;
      const chart = echarts.init(typeChartRef.value);
      chart.setOption({
        tooltip: { trigger: 'item', backgroundColor: '#fff', borderColor: '#e2e8f0' },
        legend: { bottom: 0, textStyle: { color: '#64748b' } },
        series: [{
          type: 'pie', radius: ['42%', '70%'], center: ['50%', '45%'],
          itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 3 },
          label: { show: false },
          data: data.map(d => ({ name: d.type, value: d.count }))
        }]
      });
    };

    const handleTriggerSearch = async () => {
      searchLoading.value = true;
      try {
        const res = await api.triggerSearch();
        if (res.status === 'error') ElMessage.warning(res.message);
        else { ElMessage.success(res.message || '搜索任务已下发，请稍后查看'); schedulerLogs.value = await api.getSchedulerLogs(); checkPolling(); }
      } catch (e) { ElMessage.error('搜索触发失败: ' + e.message); }
      finally { searchLoading.value = false; }
    };
    const handleTriggerAnalysis = async () => {
      analysisLoading.value = true;
      try {
        const res = await api.triggerAnalysis();
        if (res.status === 'error') ElMessage.warning(res.message);
        else { ElMessage.success(res.message || '分析任务已下发，请稍后查看'); schedulerLogs.value = await api.getSchedulerLogs(); checkPolling(); }
      } catch (e) { ElMessage.error('分析触发失败: ' + e.message); }
      finally { analysisLoading.value = false; }
    };

    onMounted(loadData);
    onUnmounted(stopPolling);
    return { stats, schedulerLogs, cityChartRef, typeChartRef, searchLoading, analysisLoading, handleTriggerSearch, handleTriggerAnalysis };
  }
};

          <template v-if="row.configKey === 'search.cities'">
            <div class="city-tags-container">
              <el-tag v-for="c in cityList" :key="c.id" size="small" closable style="cursor:pointer;" effect="plain" @click="openEditCity(c)" @close="removeCity(c)">{{ c.cityName }}</el-tag>
              <el-button size="small" type="primary" plain @click="openAddCity">+ 新增城市</el-button>
            </div>
          </template>
          <template v-else-if="row.configKey === 'volcengine.analysis-model'">
            <el-select v-model="analysisModelSelected" size="small" style="width:100%" placeholder="请选择模型">
              <el-option v-for="m in analysisModelOptions" :key="m" :label="m" :value="m" />
            </el-select>
          </template>
          <template v-else>
            <el-input v-if="editingKey === row.configKey" v-model="editingValue" size="small" />
            <span v-else style="color:#64748b">{{ row.configValue }}</span>
          </template>
        </template>
      </el-table-column>
      <el-table-column prop="description" label="说明" min-width="220" />
      <el-table-column label="更新时间" width="200">
        <template #default="{ row }">{{ formatTime(row.updatedTime) }}</template>
      </el-table-column>
      <el-table-column label="操作" width="200">
        <template #default="{ row }">
          <template v-if="row.configKey === 'search.cities'">
            <span style="color:#94a3b8;font-size:12px;">点击标签修改，x 删除</span>
          </template>
          <template v-else-if="row.configKey === 'volcengine.analysis-model'">
            <span style="color:#94a3b8;font-size:12px;">下拉切换即保存</span>
          </template>
          <template v-else-if="editingKey === row.configKey">
            <el-button size="small" type="primary" @click="saveSystemConfig(row)">保存</el-button>
            <el-button size="small" @click="cancelEditSystem">取消</el-button>
          </template>
          <el-button v-else size="small" @click="openEditSystem(row)">修改</el-button>
        </template>
      </el-table-column>
    </el-table>
    <div class="config-section-hint">
      <el-icon style="vertical-align:middle;margin-right:4px" /><info-filled style="vertical-align:middle;margin-right:4px" />
      城市通过省市联动菜单选择；去重阈值/分析模型修改后立即生效；搜索/分析 cron 修改后将自动重新注册定时任务（无需重启）。
    </div>
  </el-card>

  <el-dialog :title="cityDialogTitle" v-model="cityDialogVisible" width="420px">
    <el-form :model="cityForm" label-width="90px">
      <el-form-item label="所属省市">
        <el-cascader v-model="cityForm.cityPath" :options="provinceCityData" placeholder="请选择省市" style="width:100%;" />
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="cityDialogVisible = false">取消</el-button>
      <el-button type="primary" :loading="citySaving" @click="submitCity">确定</el-button>
    </template>
  </el-dialog>
</div>`,
  setup() {
    const cityList = ref([]);
    const systemList = ref([]);
    const configInfo = ref({});
    const cityDialogVisible = ref(false);
    const cityDialogTitle = ref('');
    const cityForm = reactive({ id: null, cityPath: [] });
    const citySaving = ref(false);
    const editingKey = ref('');
    const editingValue = ref('');
    const { ElMessage, ElMessageBox } = ElementPlus;

    const scoringRules = [
      { dimension: '文件类型分', weight: '40%', detail: '招标公告/采购公告/竞争性磋商公告 -> 40分；其他政府文件/通知 -> 20分；新闻/行业资讯 -> 10分；其他 -> 5分', score: '5-40分' },
      { dimension: '金额规模分', weight: '25%', detail: '1000万以上 -> 25分；500万-1000万 -> 20分；100万-500万 -> 15分；100万以下 -> 10分；无法识别 -> 5分', score: '5-25分' },
      { dimension: '时效性分', weight: '20%', detail: '7天内 -> 20分；30天内 -> 15分；90天内 -> 10分；超过90天/无法识别 -> 5分', score: '5-20分' },
      { dimension: '行政区划明确度', weight: '10%', detail: '精确到区县级 -> 10分；精确到市级 -> 7分；仅省级/无法识别 -> 3分', score: '3-10分' },
      { dimension: '发布主体权威性', weight: '5%', detail: '政府机关/事业单位 -> 5分；国有企业 -> 4分；其他 -> 2分', score: '2-5分' },
      { dimension: '总分', weight: '100%', detail: '以上五个维度加权求和，总分范围 0-100', score: '0-100分' },
    ];

    async function loadCities() { try { cityList.value = await api.getAllCities(); } catch (e) { ElMessage.error('加载城市失败: ' + e.message); } }
    async function loadSystemConfigs() {
      try {
        let list = await api.getAllSystemConfigs();
        if (!list.some(r => r.configKey === 'search.cities')) { list = list.concat([{ configKey: 'search.cities', configValue: '', description: '搜索抓取的城市列表（省市联动选择）', updatedTime: null }]); }
        systemList.value = list;
        configInfo.value = await api.getConfigInfo();
      } catch (e) { ElMessage.error('加载系统配置失败: ' + e.message); }
    }
    async function reloadAll() { await Promise.all([loadCities(), loadSystemConfigs()]); }

    const KEY_ANALYSIS_MODEL = 'volcengine.analysis-model';
    const analysisModelOptions = computed(() => { const row = systemList.value.find(r => r.configKey === KEY_ANALYSIS_MODEL); if (!row || !row.configValue) return []; return row.configValue.split('|').map(s => s.trim()).filter(Boolean); });
    const analysisModelSelected = computed({
      get() { return analysisModelOptions.value[0] || ''; },
      async set(m) {
        if (!m) return;
        const reordered = [m, ...analysisModelOptions.value.filter(x => x !== m)];
        try { await api.updateSystemConfig(KEY_ANALYSIS_MODEL, reordered.join('|')); ElMessage.success('模型切换成功'); await reloadAll(); } catch (e) { ElMessage.error(e.message); }
      }
    });

    function openAddCity() { cityDialogTitle.value = '新增城市'; cityForm.id = null; cityForm.cityPath = []; cityDialogVisible.value = true; }
    function openEditCity(row) { cityDialogTitle.value = '修改城市'; cityForm.id = row.id; cityForm.cityPath = findCityPath(row.cityName); cityDialogVisible.value = true; }
    function extractCityName() { const p = cityForm.cityPath; if (!p || p.length === 0) return ''; return p[p.length - 1]; }
    async function submitCity() {
      const cityName = extractCityName().trim();
      if (!cityName) { ElMessage.warning('请选择城市'); return; }
      citySaving.value = true;
      try {
        if (cityForm.id) { await api.updateCity(cityForm.id, { cityName }); ElMessage.success('修改成功'); }
        else { await api.addCity(cityName); ElMessage.success('新增成功'); }
        cityDialogVisible.value = false; await reloadAll();
      } catch (e) { ElMessage.error(e.message); }
      finally { citySaving.value = false; }
    }
    async function removeCity(row) {
      try { await ElMessageBox.confirm('确定删除城市「' + row.cityName + '」?', '提示', { type: 'warning' }); } catch { return; }
      try { await api.deleteCity(row.id); ElMessage.success('删除成功'); await reloadAll(); } catch (e) { ElMessage.error(e.message); }
    }
    function openEditSystem(row) { editingKey.value = row.configKey; editingValue.value = row.configValue; }
    function cancelEditSystem() { editingKey.value = ''; editingValue.value = ''; }
    async function saveSystemConfig(row) {
      if (!editingValue.value || !editingValue.value.trim()) { ElMessage.warning('配置值不能为空'); return; }
      try { await api.updateSystemConfig(row.configKey, editingValue.value.trim()); ElMessage.success('保存成功'); cancelEditSystem(); await loadSystemConfigs(); } catch (e) { ElMessage.error(e.message); }
    }
    function formatTime(value) {
      if (!value) return '';
      const d = new Date(value);
      if (isNaN(d.getTime())) return String(value);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}年${pad(d.getMonth()+1)}月${pad(d.getDate())}日 ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    onMounted(async () => { await reloadAll(); });
    return { cityList, systemList, configInfo, scoringRules, provinceCityData: PROVINCE_CITY_DATA, findCityPath, formatTime, analysisModelOptions, analysisModelSelected, cityDialogVisible, cityDialogTitle, cityForm, citySaving, editingKey, editingValue, openAddCity, openEditCity, submitCity, removeCity, openEditSystem, cancelEditSystem, saveSystemConfig, reloadAll };
  }
};

const routes = [
  { path: '/', component: Dashboard },
  { path: '/records', component: RecordList },
  { path: '/records/:id', component: RecordDetail, props: true },
  { path: '/config', component: Config },
];

const router = createRouter({ history: createWebHashHistory(), routes });

const pageTitles = { '/': '仪表盘', '/records': '线索列表', '/config': '系统配置' };

const app = createApp({
  setup() {
    const currentRoute = ref('/');
    const currentTime = ref('');
    const refreshTrigger = ref(0);
    const pageTitle = computed(() => { refreshTrigger.value; return pageTitles[currentRoute.value] || '仪表盘'; });
    let timer = null;
    const updateTime = () => {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      currentTime.value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    };
    const handleRefresh = () => { refreshTrigger.value++; window.dispatchEvent(new CustomEvent('app-refresh')); };
    router.afterEach((to) => { currentRoute.value = to.path; });
    onMounted(() => { updateTime(); timer = setInterval(updateTime, 1000); currentRoute.value = window.location.hash.slice(1) || '/'; });
    onUnmounted(() => { if (timer) clearInterval(timer); });
    return { currentRoute, currentTime, pageTitle, handleRefresh };
  }
});
app.use(router);
app.use(ElementPlus);
for (const [key, comp] of Object.entries(ElementPlusIconsVue)) { app.component(key, comp); }
app.mount('#app');
</script>
</body>
</html>
